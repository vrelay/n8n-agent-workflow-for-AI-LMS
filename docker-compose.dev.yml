# Development stack — Postgres + n8n from local submodule (./n8n)
# Usage: docker compose -f docker-compose.dev.yml up --build
#
# Includes your UI edits under n8n/packages/frontend/editor-ui.
# Editor: http://localhost:5678
#
# Optional Vite HMR (second terminal / override command):
#   docker compose -f docker-compose.dev.yml run --rm -p 8080:8080 n8n \
#     pnpm --filter n8n-editor-ui dev -- --host 0.0.0.0

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-n8n}
      POSTGRES_USER: ${POSTGRES_USER:-n8n}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-n8n}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  n8n:
    build:
      context: .
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    ports:
      - "5678:5678"
      - "8080:8080"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-n8n}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-n8n}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:-n8n}
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: 5678
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      N8N_SECURE_COOKIE: ${N8N_SECURE_COOKIE:-false}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_BLOCK_ENV_ACCESS_IN_NODE: ${N8N_BLOCK_ENV_ACCESS_IN_NODE:-false}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-Asia/Kolkata}
      TZ: ${GENERIC_TIMEZONE:-Asia/Kolkata}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      # Avoid interactive prompts / telemetry noise in containers
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
    volumes:
      # Live source (UI patches land here)
      - ./n8n:/app
      # Persist pnpm store across rebuilds
      - n8n_pnpm_store:/root/.local/share/pnpm/store
      # n8n runtime data (encryption key cache, etc.)
      - n8n_data:/root/.n8n
    depends_on:
      postgres:
        condition: service_healthy
    # Re-run install/build only when needed (see docker/dev-entrypoint.sh)
    command: ["pnpm", "start"]

volumes:
  postgres_data:
  n8n_data:
  n8n_pnpm_store:
